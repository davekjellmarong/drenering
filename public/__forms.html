<!DOCTYPE html>
<html lang="no">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Skjemaer</title>
  </head>
  <body>
    <!--
      Netlify Forms detects forms from static HTML at deploy time. The real
      forms are React components that POST here (src/utils/netlifyForms.ts);
      keep these field lists in sync with them.
    -->
    <form name="tilbud" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="firstname" />
      <input type="text" name="lastname" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="address" />
      <input type="text" name="zip" />
      <input type="text" name="city" />
      <input type="text" name="propertytype" />
      <input type="text" name="propertysize" />
    </form>

    <form name="partner" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="companyName" />
      <input type="text" name="contactName" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="website" />
      <input type="text" name="address" />
      <input type="text" name="postalCode" />
      <input type="text" name="city" />
    </form>
  </body>
</html>
