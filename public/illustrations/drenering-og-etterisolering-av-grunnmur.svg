<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img">
  <rect width="1200" height="600" fill="#eff6ff"/>
  <rect y="230" width="1200" height="370" fill="#c9a27e"/>
  <rect y="230" width="1200" height="30" fill="#7fae6b"/>
  <g fill="#b08968"><circle cx="760" cy="330" r="9"/><circle cx="900" cy="420" r="8"/><circle cx="1040" cy="350" r="10"/><circle cx="1100" cy="500" r="9"/><circle cx="820" cy="520" r="8"/></g>
  <!-- house above ground -->
  <rect x="80" y="60" width="440" height="190" fill="#bfdbfe"/>
  <path d="M60 70 L300 -10 L540 70 Z" fill="#1e3a8a"/>
  <rect x="150" y="110" width="70" height="70" fill="#eff6ff" stroke="#1e3a8a" stroke-width="5"/>
  <rect x="380" y="110" width="70" height="70" fill="#eff6ff" stroke="#1e3a8a" stroke-width="5"/>
  <!-- basement wall -->
  <rect x="80" y="250" width="440" height="350" fill="#eff6ff"/>
  <rect x="470" y="230" width="50" height="330" fill="#9aa3b2" stroke="#6b7280" stroke-width="3"/>
  <!-- insulation outside wall -->
  <rect x="520" y="230" width="90" height="330" fill="#fde68a" stroke="#b45309" stroke-width="3"/>
  <g stroke="#b45309" stroke-width="3"><path d="M535 250V540M555 250V540M575 250V540M595 250V540" opacity="0.5"/></g>
  <!-- membrane/fabric -->
  <path d="M612 230 V560" stroke="#2563eb" stroke-width="6" stroke-dasharray="16 8"/>
  <!-- footing and gravel -->
  <rect x="440" y="560" width="260" height="40" fill="#9aa3b2" stroke="#6b7280" stroke-width="3"/>
  <g fill="#bfc6d1" stroke="#8b93a1" stroke-width="2"><circle cx="640" cy="530" r="12"/><circle cx="670" cy="545" r="10"/><circle cx="650" cy="500" r="11"/><circle cx="690" cy="520" r="11"/></g>
  <!-- drain pipe with face -->
  <circle cx="650" cy="545" r="0"/>
  <circle cx="660" cy="528" r="26" fill="#2563eb" stroke="#1e3a8a" stroke-width="5"/>
  <circle cx="651" cy="522" r="4" fill="#eff6ff"/><circle cx="669" cy="522" r="4" fill="#eff6ff"/>
  <path d="M650 534 Q660 543 670 534" stroke="#eff6ff" stroke-width="3" fill="none"/>
  <!-- water drops running down -->
  <g fill="#60a5fa"><path d="M700 300 q10 18 0 26 q-10 -8 0 -26z"/><path d="M730 380 q10 18 0 26 q-10 -8 0 -26z"/><path d="M700 440 q10 18 0 26 q-10 -8 0 -26z"/></g>
  <!-- arrows: insulation outside -->
  <path d="M900 120 H640" stroke="#1e3a8a" stroke-width="5" fill="none"/>
  <path d="M655 105 L630 120 L655 135" stroke="#1e3a8a" stroke-width="5" fill="none"/>
</svg>
