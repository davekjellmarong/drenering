<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img">
  <rect width="1200" height="600" fill="#eff6ff"/>
  <rect x="0" y="250" width="1200" height="350" fill="#c9a27e"/>
  <rect x="0" y="250" width="1200" height="40" fill="#a9c99a"/>
  <!-- house -->
  <path d="M120 250 L320 110 L520 250Z" fill="#1e3a8a"/>
  <rect x="170" y="250" width="300" height="300" fill="#bfdbfe"/>
  <rect x="270" y="170" width="100" height="60" rx="8" fill="#60a5fa"/>
  <!-- foundation wall -->
  <rect x="170" y="290" width="40" height="250" fill="#94a3b8"/>
  <!-- insulation + plate -->
  <rect x="210" y="290" width="40" height="230" fill="#fde68a"/>
  <rect x="250" y="290" width="14" height="230" fill="#1e3a8a"/>
  <!-- gravel trench -->
  <rect x="264" y="400" width="190" height="130" rx="10" fill="#e2e8f0" stroke="#60a5fa" stroke-width="4" stroke-dasharray="14 8"/>
  <g fill="#94a3b8"><circle cx="290" cy="500" r="8"/><circle cx="330" cy="510" r="7"/><circle cx="380" cy="505" r="8"/><circle cx="420" cy="500" r="7"/><circle cx="300" cy="430" r="7"/><circle cx="410" cy="425" r="8"/></g>
  <circle cx="360" cy="465" r="30" fill="#2563eb"/><circle cx="360" cy="465" r="16" fill="#1e3a8a"/>
  <!-- pipe to kum -->
  <path d="M390 465 H700" stroke="#2563eb" stroke-width="16" stroke-linecap="round"/>
  <rect x="700" y="340" width="90" height="190" rx="14" fill="#60a5fa" stroke="#1e3a8a" stroke-width="6"/>
  <rect x="716" y="500" width="58" height="16" rx="6" fill="#1e3a8a"/>
  <path d="M790 480 H960" stroke="#2563eb" stroke-width="14" stroke-linecap="round" stroke-dasharray="6 22"/>
  <!-- excavator arm -->
  <g stroke="#c2703d" stroke-width="14" stroke-linecap="round" fill="none"><path d="M1000 250 L1060 130 L1140 190"/></g>
  <rect x="960" y="250" width="200" height="50" rx="14" fill="#c2703d"/>
  <circle cx="990" cy="310" r="18" fill="#1e3a8a"/><circle cx="1130" cy="310" r="18" fill="#1e3a8a"/>
  <path d="M1140 190 l30 30 h-50z" fill="#1e3a8a"/>
  <!-- slope arrows -->
  <path d="M560 262 L700 276" stroke="#1e3a8a" stroke-width="6" stroke-linecap="round"/>
  <path d="M690 266 l16 10 l-18 6" stroke="#1e3a8a" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- face on pipe -->
  <g transform="translate(560 440)"><circle r="22" fill="#fff" stroke="#1e3a8a" stroke-width="5"/><circle cx="-8" cy="-4" r="3" fill="#1e3a8a"/><circle cx="8" cy="-4" r="3" fill="#1e3a8a"/><path d="M-8 8q8 7 16 0" stroke="#1e3a8a" stroke-width="3" fill="none"/></g>
</svg>
