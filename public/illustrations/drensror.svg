<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img">
  <rect width="1200" height="600" fill="#c9a27e"/>
  <rect width="1200" height="60" fill="#7fae6b"/>
  <!-- fabric-wrapped gravel trench -->
  <path d="M200 220 H1000 V520 H200 Z" fill="#ebe4d8" stroke="#2479c2" stroke-width="6" stroke-dasharray="16 10"/>
  <g fill="#b6a58f">
    <circle cx="250" cy="260" r="16"/><circle cx="330" cy="250" r="13"/><circle cx="420" cy="270" r="15"/>
    <circle cx="780" cy="255" r="14"/><circle cx="870" cy="270" r="16"/><circle cx="950" cy="250" r="12"/>
    <circle cx="260" cy="480" r="15"/><circle cx="350" cy="490" r="12"/><circle cx="860" cy="485" r="14"/>
    <circle cx="950" cy="470" r="15"/><circle cx="240" cy="370" r="12"/><circle cx="960" cy="370" r="13"/>
  </g>
  <!-- perforated pipe running across -->
  <rect x="260" y="320" width="680" height="110" rx="55" fill="#1a62a6"/>
  <g fill="#7db8e4">
    <ellipse cx="340" cy="350" rx="16" ry="7"/><ellipse cx="440" cy="350" rx="16" ry="7"/><ellipse cx="540" cy="350" rx="16" ry="7"/>
    <ellipse cx="640" cy="350" rx="16" ry="7"/><ellipse cx="740" cy="350" rx="16" ry="7"/><ellipse cx="840" cy="350" rx="16" ry="7"/>
  </g>
  <g stroke="#164f87" stroke-width="5">
    <line x1="390" y1="324" x2="390" y2="426"/><line x1="490" y1="324" x2="490" y2="426"/><line x1="590" y1="324" x2="590" y2="426"/>
    <line x1="690" y1="324" x2="690" y2="426"/><line x1="790" y1="324" x2="790" y2="426"/>
  </g>
  <!-- friendly face on the pipe end -->
  <circle cx="940" cy="375" r="55" fill="#2479c2"/>
  <circle cx="940" cy="375" r="36" fill="#d6e9f7"/>
  <circle cx="926" cy="366" r="5" fill="#102a43"/><circle cx="954" cy="366" r="5" fill="#102a43"/>
  <path d="M922 386 q18 14 36 0" stroke="#102a43" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- water drops entering the pipe -->
  <g fill="#2479c2">
    <path d="M500 120 q-14 22 0 32 q14 -10 0 -32z"/><path d="M620 160 q-14 22 0 32 q14 -10 0 -32z"/>
    <path d="M700 110 q-14 22 0 32 q14 -10 0 -32z"/>
  </g>
  <!-- outflow -->
  <path d="M995 375 H1200" stroke="#2479c2" stroke-width="16" stroke-linecap="round"/>
</svg>
